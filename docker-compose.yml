services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: botbale
      POSTGRES_PASSWORD: botbale
      POSTGRES_DB: botbale
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botbale -d botbale"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
